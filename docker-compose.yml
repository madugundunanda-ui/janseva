# ─── JANSEVA Platform — Production Docker Compose ────────────────
version: '3.8'

services:
  # ─── Infrastructure ────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: janseva-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: citizen_grievance
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - janseva-network

  redis:
    image: redis:7.0-alpine
    container_name: janseva-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - janseva-network

  # ─── API Gateway ───────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: janseva-api-gateway
    ports:
      - "8080:8080" # Maps to api.janseva.in in production
    environment:
      - NODE_ENV=production
      - PORT=8080
      - BACKEND_URL=http://backend-api:5000
    depends_on:
      - backend-api
    restart: always
    networks:
      - janseva-network

  # ─── Backend Services (Modular Monolith) ───────────────────────────
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janseva-backend-api
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SERVICE_NAME=api # Only run API routes and Sockets
      - MONGO_URI=mongodb://mongodb:27017/citizen_grievance
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/src/uploads
      - backend_logs:/app/logs
    restart: always
    networks:
      - janseva-network

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janseva-backend-worker
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=worker # Only run Background Workers & Cron
      - MONGO_URI=mongodb://mongodb:27017/citizen_grievance
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    restart: always
    networks:
      - janseva-network

  # ─── Frontend Apps (Built via Nx) ──────────────────────────────────
  citizen-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.app
      args:
        APP_NAME: janseva-citizen
    container_name: janseva-citizen-ui
    ports:
      - "8081:80" # citizen.janseva.in
    restart: always
    networks:
      - janseva-network

  officer-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.app
      args:
        APP_NAME: janseva-officer
    container_name: janseva-officer-ui
    ports:
      - "8082:80" # officer.janseva.in
    restart: always
    networks:
      - janseva-network

  supervisor-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.app
      args:
        APP_NAME: janseva-supervisor
    container_name: janseva-supervisor-ui
    ports:
      - "8083:80" # supervisor.janseva.in
    restart: always
    networks:
      - janseva-network

  admin-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.app
      args:
        APP_NAME: janseva-admin
    container_name: janseva-admin-ui
    ports:
      - "8084:80" # admin.janseva.in
    restart: always
    networks:
      - janseva-network

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  uploads_data:
  backend_logs:

networks:
  janseva-network:
    driver: bridge
