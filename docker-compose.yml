# ─── JANSEVA Platform — Docker Compose ───────────────────────────
# Full-stack development and production environment

services:
  # ─── MongoDB ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: janseva-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: citizen_grievance
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - janseva-network

  # ─── Backend (Node.js/Express) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janseva-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/citizen_grievance
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_min_32_chars}
      JWT_EXPIRE: 7d
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:4200
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/src/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - janseva-network

  # ─── AI Service (Python/Flask) ───────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: janseva-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - ai_model_cache:/root/.cache
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - janseva-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  uploads_data:
    driver: local
  backend_logs:
    driver: local
  ai_model_cache:
    driver: local

networks:
  janseva-network:
    driver: bridge
