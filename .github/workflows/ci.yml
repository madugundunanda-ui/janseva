name: JANSEVA CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # ─── Backend Lint & Test ──────────────────────────────────────
  backend:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install Dependencies
        working-directory: backend
        run: npm ci
      
      - name: Run Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/janseva_test
          JWT_SECRET: test-secret-key-for-ci-pipeline-only
          BYPASS_AUTH: false
        run: npm test -- --forceExit --detectOpenHandles --coverage
      
      - name: Security Audit
        working-directory: backend
        run: npm audit --audit-level=high || true

  # ─── Frontend Build ───────────────────────────────────────────
  frontend:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build Production
        working-directory: frontend
        run: npm run build -- --configuration production
      
      - name: Security Audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ─── AI Service Validation ────────────────────────────────────
  ai-service:
    name: AI Service - Validate
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      
      - name: Install Dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt
      
      - name: Validate Syntax
        working-directory: ai-service
        run: python -m py_compile app.py

  # ─── Docker Build Validation ──────────────────────────────────
  docker:
    name: Docker - Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Docker Image
        run: docker build -t janseva-backend:ci ./backend
      
      - name: Build AI Service Docker Image
        run: docker build -t janseva-ai:ci ./ai-service
