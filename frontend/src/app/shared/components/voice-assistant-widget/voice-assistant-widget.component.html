<div class="voice-widget-container" [class.active]="state.isActive" [class.a11y-mode]="accessibilityMode">
  <!-- Floating Button -->
  <button class="voice-fab" (click)="toggleAssistant()" [class.listening]="state.isListening">
    <i class="fas fa-microphone" *ngIf="!state.isActive"></i>
    <i class="fas fa-times" *ngIf="state.isActive"></i>
  </button>

  <!-- Assistant Panel -->
  <div class="voice-panel" *ngIf="state.isActive">
    <div class="panel-header">
      <h3>Governance Voice Assistant</h3>
      <div class="header-actions">
        <span class="lang-badge" *ngIf="state.language">{{ state.language }}</span>
        <button class="a11y-toggle" (click)="toggleAccessibilityMode()" title="Elderly / High Contrast Mode">
          <i class="fas" [class.fa-universal-access]="!accessibilityMode" [class.fa-eye]="accessibilityMode"></i>
        </button>
      </div>
    </div>

    <div class="panel-body">
      <div class="system-message" *ngIf="state.systemMessage">
        <i class="fas fa-robot"></i>
        <p>{{ state.systemMessage }}</p>
      </div>

      <div class="user-transcript" *ngIf="state.transcript">
        <i class="fas fa-user"></i>
        <p>"{{ state.transcript }}"</p>
      </div>

      <div class="status-indicator">
        <div class="pulsing-mic" *ngIf="state.isListening">
          <span>Listening...</span>
          <div class="waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
          </div>
        </div>
        <div class="speaking-indicator" *ngIf="state.isSpeaking">
          <span>Speaking...</span>
        </div>
      </div>
      
      <!-- Hidden file input for workflows that require an image -->
      <input type="file" #fileInput accept="image/*" style="display: none;" (change)="onFileSelected($event)">
    </div>
  </div>
</div>
